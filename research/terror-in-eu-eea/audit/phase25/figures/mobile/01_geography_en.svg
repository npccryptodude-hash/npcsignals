<svg xmlns="http://www.w3.org/2000/svg" xml:lang="en" width="360" height="407" viewBox="0 0 360 407" role="img" aria-labelledby="title desc">
<title id="title">EU28 and fixed EU27</title>
<desc id="desc">2015: 211 / 108 | 2016: 142 / 66 | 2017: 205 / 98 | 2018: 129 / 69 | 2019: 119 / 55. Reported entries: original EU28 / fixed EU27. UK rows excluded from the fixed series. UK rows: 103 / 76 / 107 / 60 / 64. The 193 chart value for 2015 remains unresolved; the annual total is 211. Sources: TE-SAT 2016–2020 annexes. Fixed geography retains national reporting differences.</desc>
