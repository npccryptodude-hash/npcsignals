2026-05-12: finality: murder and IS membership judgment final | Solingen
2026-05-22: court summary published: lower court found encouragement and advice by IS contacts. A100 linkage to the deleted Europol entry remains a candidate. The cases do not establish common operational command. Sources: LG Berlin 5/2022; BGH 036/2023; PET 14 May 2024; TE-SAT 2025; BGH 3 StR 55/26 and notice 091/2026.</desc>
