<title id="title">Reported counts at fixed EU27</title>
<desc id="desc">2015: 108 / 943 | 2016: 66 / 853 | 2017: 98 / 807 | 2018: 69 / 783 | 2019: 55 / 723 | 2020: 57 / 449 | 2021: 15 / 388 | 2022: 28 / 380 | 2023: 120 / 426 | 2024: 58 / 449 | 2025: 45 / 486. Each row: reported attack entries / reported arrests. From 2020 the UK is outside the original series. 2023 contains 26 older attack entries; arrests 426 versus later annex sum 431. The 2015 chart value 193 and 2025 age denominator 347/344 remain unresolved. Sources: TE-SAT 2016–2026. The series does not measure physical attack frequency.</desc>
