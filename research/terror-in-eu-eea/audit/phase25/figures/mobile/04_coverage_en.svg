<desc id="desc">2015 (n=211): 9 / 3 / 199 | 2016 (n=142): 20 / 1 / 121 | 2017 (n=205): 27 / 1 / 177 | 2018 (n=129): 22 / 0 / 107 | 2019 (n=119): 24 / 1 / 94 | 2020 (n=57): 15 / 0 / 42 | 2021 (n=15): 14 / 1 / 0 | 2022 (n=28): 12 / 3 / 13 | 2023 (n=120): 9 / 1 / 110 | 2024 (n=58): 9 / 7 / 42 | 2025 (n=45): 7 / 17 / 21. Adequately identified / candidate / unidentified. Each denominator is the original annual cohort: EU28 through 2019, EU27 from 2020. 2025: 17 candidate entries and 18 possible identities. These counts cannot establish physical incident coverage. Source: NPCsignals frozen crosswalk and Phase 22 annual analysis.</desc>
