<text x="529" y="346" font-size="22" font-weight="bold">56</text>
<text x="35" y="405" font-size="14">2019 UK contribution: 64 entries (119 − 64 = 55).</text>
<text x="35" y="427" font-size="14">Fixed geography retains national reporting and classification differences.</text>
<text x="35" y="449" font-size="14">The later official revision is shown separately from the original cohort.</text>
<text x="35" y="471" font-size="14">TE-SAT 2020 p. 84 · TE-SAT 2021 pp. 12, 99 · TE-SAT 2023 p. 9 n. 4.</text>
<text x="35" y="493" font-size="14">Reported statistical entries. Physical attack frequency cannot be inferred.</text>
