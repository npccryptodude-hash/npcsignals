<title id="title">2019–2020: geography changes the comparison</title>
<desc id="desc">2019 · original EU28: 119; 2019 · fixed EU27: 55; 2020 · original EU27: 57; 2020 · later official revision: 56. Reported statistical entries. Physical attack frequency cannot be inferred.</desc>
<metadata>NPCsignals internal review. Statistical source commit d1f675eb785db712655c6952e43f3a57dd31f66c.</metadata>
<rect width="100%" height="100%" fill="#fff"/>
<g font-family="DejaVu Sans, sans-serif" fill="#162436">
<text x="35" y="48" font-size="26" font-weight="bold">2019–2020: geography changes the comparison</text>
<text x="35" y="79" font-size="14">Reported attack entries</text>
<text x="35" y="130" font-size="16">2019 · original EU28</text>
<rect x="290" y="103" width="476" height="40" fill="#235886"/>
<text x="781" y="130" font-size="22" font-weight="bold">119</text>
<text x="35" y="202" font-size="16">2019 · fixed EU27</text>
<rect x="290" y="175" width="220" height="40" fill="#17746b"/>
<text x="525" y="202" font-size="22" font-weight="bold">55</text>
<text x="35" y="274" font-size="16">2020 · original EU27</text>
<rect x="290" y="247" width="228" height="40" fill="#17746b"/>
<text x="533" y="274" font-size="22" font-weight="bold">57</text>
